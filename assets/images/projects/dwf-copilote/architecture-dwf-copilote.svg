<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Architecture publique DWF-Copilote en six couches</title>
<desc id="svg-desc">Du CRM, des tickets et des fournisseurs à la collecte, la Knowledge SQLite, le contexte des tickets, la trajectoire IA et les portails. Les états distinguent réalisé local, mixte et cible.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0a1220"/><stop offset="1" stop-color="#101e2b"/></linearGradient></defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<rect x="48" y="32" width="1824" height="1016" rx="24" fill="none" stroke="#365063" stroke-width="2"/>

<text x="91" y="91" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#f8fafc"><tspan x="91" dy="0">DWF-COPILOTE  /  ARCHITECTURE DE RÉFÉRENCE</tspan></text>
<text x="93" y="131" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#9db2c7"><tspan x="93" dy="0">Du patrimoine technique au support gouverné — synthèse publique KDv2 → KDv4</tspan></text>

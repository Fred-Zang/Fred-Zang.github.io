<rect x="105" y="733" width="82" height="86" rx="12" fill="#b89eff" fill-opacity=".12"/>
<text x="123" y="790" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="#b89eff"><tspan x="123" dy="0">05</tspan></text>
<text x="218" y="764" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f7ff"><tspan x="218" dy="0">IA &amp; RAG — TRAJECTOIRE</tspan></text>
<text x="218" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#b89eff"><tspan x="218" dy="0">Cible, pas en production</tspan></text>
<text x="835" y="764" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#c6d4e2"><tspan x="835" dy="0">classification  •  recherche documentaire + Knowledge  •  LLM</tspan><tspan x="835" dy="31">diagnostic et proposition de résolution  •  validation humaine obligatoire</tspan></text>
<path d="M960 833 V856" stroke="#8ca3b7" stroke-width="4" stroke-dasharray="none"/>
<path d="M950 848 L960 859 L970 848" fill="none" stroke="#8ca3b7" stroke-width="3"/>

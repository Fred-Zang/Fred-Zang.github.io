<text x="123" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="#58d8ed"><tspan x="123" dy="0">02</tspan></text>
<text x="218" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f7ff"><tspan x="218" dy="0">COLLECTE &amp; NORMALISATION</tspan></text>
<text x="218" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#58d8ed"><tspan x="218" dy="0">Pilotes et collectes qualifiés</tspan></text>
<text x="835" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#c6d4e2"><tspan x="835" dy="0">API et import  •  Git  •  SSH / FTPES  •  cPanel  •  navigateur contrôlé</tspan><tspan x="835" dy="31">périmètres, instantanés et diagnostics traçables</tspan></text>
<path d="M960 422 V445" stroke="#8ca3b7" stroke-width="4" stroke-dasharray="none"/>

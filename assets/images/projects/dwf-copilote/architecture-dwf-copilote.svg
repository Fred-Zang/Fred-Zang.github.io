<text x="123" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="#58d8ed"><tspan x="123" dy="0">03</tspan></text>
<text x="218" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f7ff"><tspan x="218" dy="0">KNOWLEDGE &amp; QUALITÉ</tspan></text>
<text x="218" y="527" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#58d8ed"><tspan x="218" dy="0">Réalisé / qualification progressive</tspan></text>
<text x="835" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#c6d4e2"><tspan x="835" dy="0">SQLite  •  identités et rattachements  •  provenance et fraîcheur</tspan><tspan x="835" dy="31">relations attestées / candidates  •  contrôles et revue humaine</tspan></text>
<path d="M960 559 V582" stroke="#8ca3b7" stroke-width="4" stroke-dasharray="none"/>
<path d="M950 574 L960 585 L970 574" fill="none" stroke="#8ca3b7" stroke-width="3"/>

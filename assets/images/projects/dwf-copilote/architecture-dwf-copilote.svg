<text x="218" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f7ff"><tspan x="218" dy="0">SOURCES &amp; PROVIDERS</tspan></text>
<text x="218" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#58d8ed"><tspan x="218" dy="0">Démontré sur périmètres contrôlés</tspan></text>
<text x="835" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#c6d4e2"><tspan x="835" dy="0">DWF / CRM et tickets  •  Bitbucket / Git  •  o2switch  •  Infomaniak</tspan><tspan x="835" dy="31">DNS / WHOIS  •  documentation fournisseur</tspan></text>
<path d="M960 285 V308" stroke="#8ca3b7" stroke-width="4" stroke-dasharray="none"/>

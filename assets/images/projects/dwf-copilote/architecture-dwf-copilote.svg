<rect x="105" y="596" width="82" height="86" rx="12" fill="#58d8ed" fill-opacity=".12"/>
<text x="123" y="653" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="#58d8ed"><tspan x="123" dy="0">04</tspan></text>
<text x="218" y="627" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f7ff"><tspan x="218" dy="0">TICKET &amp; CONTEXTE</tspan></text>
<text x="218" y="664" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#58d8ed"><tspan x="218" dy="0">Démontré en local / sous contrôle</tspan></text>
<text x="835" y="627" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#c6d4e2"><tspan x="835" dy="0">ticket → client → site → domaine → dépôt → hébergement → runtime</tspan><tspan x="835" dy="31">preuves vérifiées  •  contexte borné  •  préparation du diagnostic</tspan></text>

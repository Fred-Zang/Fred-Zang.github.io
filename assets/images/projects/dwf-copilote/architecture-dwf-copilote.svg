<rect x="105" y="870" width="82" height="86" rx="12" fill="#ffbf70" fill-opacity=".12"/>
<text x="123" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="#ffbf70"><tspan x="123" dy="0">06</tspan></text>
<text x="218" y="901" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f7ff"><tspan x="218" dy="0">PORTAILS &amp; INDUSTRIALISATION</tspan></text>
<text x="218" y="938" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#ffbf70"><tspan x="218" dy="0">Réalisé local + objectifs à valider</tspan></text>
<text x="835" y="901" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#c6d4e2"><tspan x="835" dy="0">portail client en lecture seule  •  portail de revue  •  jobs</tspan><tspan x="835" dy="31">Docker en validation locale  •  observabilité  •  RBAC / bascule futurs</tspan></text>
<text x="94" y="1031" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb2c4"><tspan x="94" dy="0">Trait plein : fonction démontrée localement   •   Pointillés : couche cible   •   Aucun accès aux données clients dans ce schéma</tspan></text>

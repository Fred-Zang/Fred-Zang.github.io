<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="ti td"><title id="ti">Contexte d’un ticket DWF-Copilote</title><desc id="td">Un ticket est rattaché à une identité vérifiée, enrichi par la Knowledge et les preuves avant la revue humaine ; l'aide RAG demeure une trajectoire.</desc><rect width="1600" height="470" fill="#0d1724" rx="28"/>

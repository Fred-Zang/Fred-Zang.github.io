<text x="76" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#b6aecf"><tspan x="76" dy="0">Aucune décision autonome de résolution ou de déploiement n’est annoncée comme opérationnelle.</tspan></text>
